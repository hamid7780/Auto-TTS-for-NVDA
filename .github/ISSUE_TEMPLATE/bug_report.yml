name: Bug report
description: Report an Auto TTS problem with reproducible details.
body:
  - type: input
    id: versions
    attributes:
      label: NVDA and Auto TTS versions
      placeholder: 'NVDA 2026.2; Auto TTS 1.0.2'
    validations:
      required: true
  - type: textarea
    id: voices
    attributes:
      label: Synthesizers, voices and language profiles
      description: Include relevant detection, language lock and exclusion settings.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and sample text
      description: Remove private content from sample text and any logs.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: NVDA log (optional)
      description: Open it with NVDA+F1. Lines from this add-on start with AutoTTS. For late speech, set the logging level to Debug first and include the lines that say "took". Remove private text.
