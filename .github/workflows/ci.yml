name: Check, build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Python ${{ matrix.python }} ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.7'
            architecture: x86
          - python: '3.11'
            architecture: x86
          - python: '3.13'
            architecture: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Bundled native detector and model
        run: python tools/check_runtime.py

  package:
    name: Build installable add-on
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build and verify release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            python build.py --output-dir dist --expected-version $version
          } else {
            python build.py --output-dir dist
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autoTTS-addon
          path: |
            dist/*.nvda-addon
            dist/*.sha256
          if-no-files-found: error
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --title "Auto TTS $($env:GITHUB_REF_NAME.Substring(1))" --notes-file RELEASE_NOTES.md --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Auto TTS $($env:GITHUB_REF_NAME.Substring(1))" --notes-file RELEASE_NOTES.md --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
