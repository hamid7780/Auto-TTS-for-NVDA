name = autoTTS
summary = "Auto TTS for NVDA"
description = """Automatically detect text language and switch between selected voices while NVDA reads multilingual content. Configure a synthesizer, voice, speech rate, pitch and volume for each language in NVDA Settings > Auto TTS for NVDA."""
author = "Raja Hamid"
version = "1.1.0"
minimumNVDAVersion = 2023.3
lastTestedNVDAVersion = 2026.3
updateChannel = stable
url = "https://github.com/hamid7780/Auto-TTS-for-NVDA"
docFileName = readme.html
changelog = "Major release: ETI Eloquence 16kHz audio stutter fix, instant voice loading and smart voice matching, offline shared-script regional language disambiguation, enhanced number processing (Unicode digits and Indian/Western large numbers), diagnostic activity logging, Say All stability, and NVDA 2026.3 compatibility."
