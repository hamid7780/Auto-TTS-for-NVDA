name = autoTTS
summary = "Auto TTS for NVDA"
description = """Automatically detect text language and switch between selected voices while NVDA reads multilingual content. Configure a synthesizer, voice, speech rate, pitch and volume for each language in NVDA Settings > Auto TTS for NVDA."""
author = "Raja Hamid"
version = "1.0.2"
minimumNVDAVersion = 2023.3
lastTestedNVDAVersion = 2026.2
updateChannel = stable
url = "https://github.com/hamid7780/Auto-TTS-for-NVDA"
docFileName = readme.html
changelog = "Cancelling speech now stops only the voices that were speaking, which reduces the delay after key presses. Adds timing lines to the NVDA debug log, rewrites the user guide and moves the project to its new address."
