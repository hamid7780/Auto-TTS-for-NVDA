name = autoTTS
summary = "Auto TTS for NVDA"
description = """Automatically switch between configured voices and synthesizers while NVDA reads multilingual text. Includes per-language rate, pitch and volume, Urdu/Arabic-aware detection, offline language identification, a temporary language lock, application exclusions, and settings import/export. Configure language profiles in NVDA Settings > Auto TTS, then select Auto TTS for NVDA as your synthesizer."""
author = "Raja Hamid"
version = "1.0.0"
minimumNVDAVersion = 2023.3
lastTestedNVDAVersion = 2026.1.1
updateChannel = stable
url = "https://github.com/hamid7780/autoTTS"
docFileName = readme.html
changelog = "First public release with multilingual speech routing, offline detection, language profiles, and settings recovery safeguards."
